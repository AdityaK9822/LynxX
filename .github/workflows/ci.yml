name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    name: Soroban contracts — test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Lints
        run: cargo fmt --check && cargo clippy -- -D warnings

      - name: Security Audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run security audit
        run: cargo audit
        working-directory: contract

      - name: Pre-build fund contract to WASM
        run: |
          rustup target add wasm32v1-none
          cargo build --target wasm32v1-none --release -p fund
        working-directory: contract

      - name: Run contract unit tests with coverage
        run: cargo llvm-cov --all-features --workspace

  frontend:
    name: Frontend — test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm config set ignore-scripts true && pnpm install --no-frozen-lockfile

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Frontend Lints
        run: pnpm run lint && pnpm -r run lint

      - name: Frontend Tests
        run: pnpm run test && pnpm -r run test

      - name: Build SDK and packages
        run: pnpm -r --workspace-concurrency=1 run build
        env:
          CI: false

      - name: Build Next.js application
        run: pnpm run build
        env:
          CI: false
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: "--max-old-space-size=4096"
